[package]
name = "frictiondetect"
version = "0.1.0"
edition = "2021"
authors = ["Mohammed Usman"]
license = "Proprietary"
description = "A CLI tool that shows friction points in structured logs."
repository = "https://github.com/musman-uk/frictiondetect"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
